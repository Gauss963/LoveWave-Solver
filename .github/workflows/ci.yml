name: macOS CI and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B "$RUNNER_TEMP/lovewave-build" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$RUNNER_TEMP/lovewave-build" --parallel

      - name: Stage macOS executable
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/lovewave-build/main" "$RUNNER_TEMP/release-assets/LoveWave-Solver-macos-arm64"

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS executable
        uses: actions/download-artifact@v4
        with:
          name: macos-executable
          path: ${{ runner.temp }}/release-assets

      - name: Create or update v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "LoveWave-Solver $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/* --clobber
